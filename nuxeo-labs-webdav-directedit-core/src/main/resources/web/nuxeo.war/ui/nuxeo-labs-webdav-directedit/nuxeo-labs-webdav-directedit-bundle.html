<link rel="import" href="nuxeo-labs-webdav-directedit.html">

<!--
  Register the "Open in Microsoft Office" button in the document actions.

  This is a DOCUMENT action rather than a BLOB action on purpose. The WebDAV module exposes exactly one
  file per document, the one returned by the document's BlobHolder: its whole API is DocumentModel-keyed
  and carries no xpath, and a WebDAV PUT always lands on that same blob. Offering the button on an
  attachment row would therefore let Microsoft Office edit one file and, on save, overwrite another.

  The element itself decides whether to render, based on the document's main blob and on the configured
  Microsoft Office formats.

  Order 12 places the action just after Edit (10) and before Delete (15).
-->
<nuxeo-slot-content name="webdavDirectEditAction" slot="DOCUMENT_ACTIONS" order="12">
  <template>
    <nuxeo-labs-webdav-directedit document="[[document]]" user="[[user]]"></nuxeo-labs-webdav-directedit>
  </template>
</nuxeo-slot-content>
